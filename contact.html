<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>πLab - Contact & Contribution</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="apple-touch-icon" href="images/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo-container">
                <img src="images/pilab.png" alt="πLab Logo" class="logo-img">
            </a>
            <div class="nav-wrapper">
                <div class="search-container">
                    <input type="text" id="global-search" placeholder="Rechercher (ex: Analyse, S3)..." class="search-input" aria-label="Recherche">
                    <ul id="search-results" class="search-results"></ul>
                </div>
                <a href="contact.html" class="nav-link" style="color: var(--primary-color);">Contact</a>
                <div class="controls">
                    <button id="dark-mode-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                        <img id="theme-icon" src="images/moon.svg" alt="Dark Mode" class="theme-icon-img">
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">Contact & Contribution</h1>
        
        <div class="contact-container">
            <p style="text-align: center; margin-bottom: 2rem; color: var(--text-muted);">
                Vous souhaitez partager un résumé, un TD, un ancien examen, ou simplement nous contacter ? Remplissez ce formulaire !
            </p>
            <form id="contactForm" action="https://formsubmit.co/imalailazkai.50026091@gmail.com" method="POST" enctype="multipart/form-data">
                <!-- Disable Captcha -->
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="Nouveau message depuis πLab !">

                <div class="form-group">
                    <label for="name">Nom Complet</label>
                    <input type="text" id="name" name="name" class="form-control" required placeholder="Votre nom...">
                </div>
                <div class="form-group">
                    <label for="email">Adresse Email</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="votre.email@exemple.com">
                </div>
                <div class="form-group">
                    <label for="type">Type de contribution</label>
                    <select id="type" name="type" class="form-control">
                        <option value="question">Question / Remarque</option>
                        <option value="cours">Partage d'un Cours</option>
                        <option value="td">Partage de TD / Exercices</option>
                        <option value="examen">Partage d'un ancien Examen</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Message ou Lien (Google Drive, etc.)</label>
                    <textarea id="message" name="message" class="form-control" placeholder="Laissez votre message ou un lien vers vos fichiers ici... (Si le fichier est très grand, mettez le lien Google Drive)"></textarea>
                </div>
                <div class="form-group">
                    <label for="attachment">Joindre un fichier (Max 5MB)</label>
                    <input type="file" id="attachment" name="attachment" class="form-control" accept=".pdf,.png,.jpg,.jpeg">
                    <small id="fileError" style="color: red; display: none; margin-top: 5px;">Le fichier est trop grand. Limite: 5MB.</small>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Envoyer</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 15/07/2025 publié - PIlab Maths</p>
        </div>
    </footer>

    <script src="js/main.js" defer></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            const fileInput = document.getElementById('attachment');
            const fileError = document.getElementById('fileError');
            
            if (fileInput.files.length > 0) {
                const fileSize = fileInput.files[0].size / 1024 / 1024; // in MB
                if (fileSize > 5) {
                    e.preventDefault();
                    fileError.style.display = 'block';
                    fileInput.value = ''; // clear input
                    return false;
                }
            }
            fileError.style.display = 'none';
        });
    </script>
</body>
</html>
