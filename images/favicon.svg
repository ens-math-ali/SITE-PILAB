<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="piGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4da3ff" />
      <stop offset="100%" stop-color="#0062cc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <g font-family="'Times New Roman', serif" font-size="100" font-style="italic" font-weight="bold" text-anchor="middle">
    <!-- 3D Extrusion Depth -->
    <text x="60" y="90" fill="#003580">π</text>
    <text x="60" y="89" fill="#003d91">π</text>
    <text x="60" y="88" fill="#0045a1">π</text>
    <text x="60" y="87" fill="#004db3">π</text>
    <text x="60" y="86" fill="#0056c0">π</text>
    
    <!-- Top Face -->
    <text x="60" y="85" fill="url(#piGrad)" filter="url(#shadow)">π</text>
  </g>
</svg>
