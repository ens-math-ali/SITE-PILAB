<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <style>
      .math-symbol { font-family: 'Times New Roman', serif; font-style: italic; opacity: 0.15; fill: #007bff; }
      .module-name { font-family: 'Segoe UI', sans-serif; font-weight: 700; opacity: 0.8; fill: #0a192f; text-transform: uppercase; letter-spacing: 2px; }
      .highlight { fill: #007bff; }
      
      @media (prefers-color-scheme: dark) {
        .bg { fill: #121212; }
        .math-symbol { fill: #00d2ff; opacity: 0.1; }
        .module-name { fill: #e0e0e0; }
        .highlight { fill: #00d2ff; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" fill="url(#bgGrad)" />

  <!-- Floating Math Symbols (Background Art) -->
  <text x="50" y="80" font-size="60" class="math-symbol">∫</text>
  <text x="700" y="100" font-size="80" class="math-symbol">∑</text>
  <text x="100" y="300" font-size="70" class="math-symbol">∂</text>
  <text x="600" y="350" font-size="60" class="math-symbol">∞</text>
  <text x="400" y="50" font-size="50" class="math-symbol">π</text>
  <text x="300" y="380" font-size="60" class="math-symbol">∀</text>
  <text x="750" y="250" font-size="55" class="math-symbol">∃</text>
  <text x="20" y="200" font-size="65" class="math-symbol">∇</text>
  <text x="500" y="150" font-size="40" class="math-symbol">dx</text>

  <!-- Central Composition -->
  <g transform="translate(400, 200)" text-anchor="middle">
      
      <!-- Main Title replacement art -->
      <text y="-40" font-size="50" class="module-name">ENS <tspan class="highlight">Tétouan</tspan></text>
      <text y="20" font-size="70" class="module-name" font-weight="900">MATHS</text>
      
      <!-- Orbiting Modules -->
      <circle cx="0" cy="10" r="140" fill="none" stroke="#007bff" stroke-width="1" opacity="0.2" stroke-dasharray="5,5" />
      
      <text x="-160" y="0" font-size="14" class="module-name" opacity="0.6">Algèbre</text>
      <text x="160" y="0" font-size="14" class="module-name" opacity="0.6">Analyse</text>
      <text x="0" y="-160" font-size="14" class="module-name" opacity="0.6">Topologie</text>
      <text x="0" y="170" font-size="14" class="module-name" opacity="0.6">Probabilités</text>
      
      <text x="-120" y="-120" font-size="12" class="module-name" opacity="0.4">Géométrie</text>
      <text x="120" y="120" font-size="12" class="module-name" opacity="0.4">Statistiques</text>
      <text x="-120" y="120" font-size="12" class="module-name" opacity="0.4">Optique</text>
      <text x="120" y="-120" font-size="12" class="module-name" opacity="0.4">Mécanique</text>

  </g>
</svg>
