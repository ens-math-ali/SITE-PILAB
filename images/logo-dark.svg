<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))">
  <defs>
    <!-- Dark Mode Specific Gradients for the Glossy 3D Look -->
    <!-- Pi Gradients -->
    <linearGradient id="piGradDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="30%" stop-color="#0288d1" />
      <stop offset="70%" stop-color="#01579b" />
      <stop offset="100%" stop-color="#002171" />
    </linearGradient>
    <!-- Text Gradients -->
    <linearGradient id="textGradDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29b6f6" />
      <stop offset="40%" stop-color="#0277bd" />
      <stop offset="60%" stop-color="#01579b" />
      <stop offset="100%" stop-color="#001a57" />
    </linearGradient>
    <!-- Highlight Overlay for Glossy text-->
    <linearGradient id="glossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="41%" stop-color="rgba(255,255,255,0)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <!-- Dot Gradient -->
    <radialGradient id="dotGradDark" cx="0.4" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ffcc80" />
      <stop offset="40%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </radialGradient>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@900&amp;display=swap');
      /* Base Style with stroke for 3d rim effect */
      .pi { font-family: 'Times New Roman', serif; font-size: 110px; font-style: italic; font-weight: bold; fill: url(#piGradDark); letter-spacing: -6px; stroke: #81d4fa; stroke-width: 1px;}
      .text { font-family: 'Nunito', sans-serif; font-size: 90px; font-weight: 900; fill: url(#textGradDark); letter-spacing: -1px; stroke: #4fc3f7; stroke-width: 0.5px;}
      .stem { fill: url(#textGradDark); stroke: #4fc3f7; stroke-width: 0.5px;}
      
      /* Overlay Style for the gloss */
      .pi-gloss { font-family: 'Times New Roman', serif; font-size: 110px; font-style: italic; font-weight: bold; fill: url(#glossGrad); letter-spacing: -6px; pointer-events: none;}
      .text-gloss { font-family: 'Nunito', sans-serif; font-size: 90px; font-weight: 900; fill: url(#glossGrad); letter-spacing: -1px; pointer-events: none;}
      .stem-gloss { fill: url(#glossGrad); pointer-events: none;}
    </style>
  </defs>
  
  <g transform="translate(10, 10)">
    <!-- Base Elements (Colors + Stroke) -->
    <text x="10" y="95" class="pi">π</text>
    <rect x="110" y="47" width="20" height="45" rx="6" class="stem" />
    <text x="135" y="92" class="text">lab</text>
    <circle cx="120" cy="25" r="14" fill="url(#dotGradDark)" stroke="#ffb74d" stroke-width="1px" />

    <!-- Gloss Overlays -->
    <text x="10" y="95" class="pi-gloss">π</text>
    <rect x="110" y="47" width="20" height="45" rx="6" class="stem-gloss" />
    <text x="135" y="92" class="text-gloss">lab</text>
  </g>
</svg>
