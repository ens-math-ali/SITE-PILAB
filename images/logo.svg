<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="piGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29b6f6" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0288d1" />
      <stop offset="100%" stop-color="#002171" />
    </linearGradient>
    <radialGradient id="dotGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb74d" />
      <stop offset="100%" stop-color="#e65100" />
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@900&amp;display=swap');
      .pi { font-family: 'Times New Roman', serif; font-size: 110px; font-style: italic; font-weight: bold; fill: url(#piGrad); letter-spacing: -6px; }
      .text { font-family: 'Nunito', sans-serif; font-size: 90px; font-weight: 900; fill: url(#textGrad); letter-spacing: -1px; }
      .stem { fill: url(#textGrad); }
    </style>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Pi -->
    <text x="10" y="95" class="pi">π</text>
    
    <!-- i dot -->
    <circle cx="120" cy="25" r="14" fill="url(#dotGrad)" />
    <!-- i stem -->
    <rect x="110" y="47" width="20" height="45" rx="6" class="stem" />
    
    <!-- lab -->
    <text x="135" y="92" class="text">lab</text>
  </g>
</svg>
