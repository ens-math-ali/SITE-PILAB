<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Swoosh/Orbit background -->
    <path d="M10,60 Q5,30 40,10" fill="none" stroke="url(#gradBrand)" stroke-width="4" stroke-linecap="round" />
    <path d="M10,60 Q30,90 70,80" fill="none" stroke="url(#gradBrand)" stroke-width="4" stroke-linecap="round" />
            
    <!-- Pi Symbol - Centered -->
    <text x="35" y="70" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="65" fill="#007bff">π</text>
  </g>

  <!-- Text - Just "LAB" now, Pi is the Icon -->
  <text x="90" y="65" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="42" fill="#0a192f">LAB</text>
</svg>
