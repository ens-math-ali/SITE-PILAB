    "@context": "https://schema.org",

    "itemListElement": [{
      "@type": "ListItem",
      "position": 1,

    },{

      "position": 2,

<body>
  <header>
    <div class="container">
      <a href="index.html" class="logo-container">
        <img src="images/pilab.png" alt="πLab Logo" class="logo-img">
      </a>

            <div class="nav-wrapper">
                <div class="search-container">
                    <input type="text" id="global-search" placeholder="Rechercher (ex: Analyse, S3)..." class="search-input" aria-label="Recherche">
                    <ul id="search-results" class="search-results"></ul>
                </div>
                <a href="contact.html" class="nav-link">Contact</a>
                <div class="controls">
                    <button id="dark-mode-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                        <img id="theme-icon" src="images/moon.svg" alt="Dark Mode" class="theme-icon-img">
                    </button>
                </div>
            </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Documents PDF</h1>

    <div class="filter-controls" style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
      <button class="btn-secondary filter-btn active" data-filter="all">Tous</button>
      <button class="btn-secondary filter-btn" data-filter="cours">Cours</button>
      <button class="btn-secondary filter-btn" data-filter="td">TD & Séries</button>
    </div>

    <div class="grid-layout" id="pdfContainer">
      <!-- Content injected by js/pdfGridLoader.js -->
    </div>

    <div style="text-align: center; margin-top: 3rem;">
      <button onclick="history.back()" class="btn-secondary">
        <span>←</span> Retour
      </button>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 15/07/2025 publié - PIlab Maths</p>
    </div>
  </footer>

  <!-- PDF Modal View -->
  <div class="modal-overlay" id="pdfModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closePdf()">×</button>
      <iframe id="pdfViewer" class="modal-iframe" src=""></iframe>
    </div>
  </div>

  <script src="js/pdfGridLoader.js" defer></script>
  <script src="js/main.js" defer></script>

</html>
