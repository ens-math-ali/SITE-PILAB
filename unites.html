  <script>
    // Data
    const units = {
      s1: [
        { name: "Analyse 1", id: "s1-analyse1" },

      s2: [
        { name: "Analyse 2", id: "s2-analyse2" },
        { name: "Analyse 3", id: "s2-analyse3" },
        { name: "Algèbre 3", id: "s2-algebre3" },
        { name: "Optique", id: "s2-optique" },
        { name: "Electrostatique", id: "s2-electro" },
        { name: "Informatique 2", id: "s2-info2" }
      ],
      s3: [
        { name: "Analyse 4", id: "s3-analyse4" },
        { name: "Analyse 5", id: "s3-analyse5" },
        { name: "Algèbre 4", id: "s3-algebre4" },
        { name: "Science éducation", id: "s3-sc" },
        { name: "Mécanique", id: "s3-mecanique" },
        { name: "Informatique 3 (C)", id: "s3-info3" }
      ],
      s4: [
        { name: "Analyse 6", id: "s4-analyse6" },
        { name: "Analyse numérique", id: "s4-numerique" },
        { name: "Probabilités", id: "s4-proba" },
        { name: "Algèbre 5", id: "s4-algebre5" },
        { name: "Didactique", id: "s4-dida" },
        { name: "Informatique 4 (C)", id: "s4-info4" }
      ],
      s5: [
        { name: "Topologie", id: "s5-topologie" },
        { name: "Structures algébriques", id: "s5-algebrique" },
        { name: "Mesure et intégration", id: "s5-mesure" },
        { name: "Déontologie", id: "s5-diontologie" },
        { name: "Didactique", id: "s5-didactique" }
      ],
      s6: [
        { name: "Calcul différentiel", id: "s6-diff" },
        { name: "Analyse complexe", id: "s6-complexe" },
        { name: "Algèbre et géométrie", id: "s6-geo" },
        { name: "Approches et méthodes", id: "s6-methodes" },
        { name: "Épistémologie", id: "s6-epi" }
      ],
      examens: [
        { name: "Examens S1", id: "e1" },
        { name: "Examens S2", id: "e2" },
        { name: "Examens S3", id: "e3" },
        { name: "Examens S4", id: "e4" },
        { name: "Examens S5", id: "e5" },
        { name: "Examens S6", id: "e6" }
      ],
      Concours: [
        { name: "2024", id: "24" },
        { name: "2023", id: "23" },
        { name: "2022", id: "22" },
        { name: "2021", id: "21" },
        { name: "2020", id: "20" },
        { name: "2019", id: "19" },
        { name: "2018", id: "18" },
        { name: "2017", id: "17" },
        { name: "2016", id: "16" }
      ]
    };

    // DOM Manipulation
    const params = new URLSearchParams(window.location.search);
    const semestre = params.get("semestre");
    const title = document.getElementById("title");
    const container = document.getElementById("modules-container");

    if (semestre && units[semestre]) {
      title.textContent = `Modules – ${semestre.toUpperCase()}`;

      units[semestre].forEach(unit => {
        const card = document.createElement("a");
        card.className = "card";
        card.href = `pdf.html?u=${unit.id}`;

        // Add a visual indicator or icon placeholder if desired
        const heading = document.createElement("h3");
        heading.textContent = unit.name;

        card.appendChild(heading);
        container.appendChild(card);
      });
    } else {
      title.textContent = "Aucun semestre sélectionné";
      container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center;">
                    <p class="hero-subtitle">Veuillez sélectionner un semestre valide.</p>
                </div>
            `;
    }
  </script>
